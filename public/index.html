<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Virtual Browser</title>
    <meta name="description" content="A secure, remotely-hosted virtual browser session.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shield-icon" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <h2>Secure Session</h2>
                <p>Enter your password to access the remote browser.</p>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="input-group">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password-input" placeholder="Password" required autocomplete="current-password" />
                </div>
                <div id="login-error" class="error-msg hidden" role="alert"></div>
                <button type="submit" id="login-btn">
                    <span>Connect</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Main Browser UI -->
    <div id="app-container" class="app-container hidden" aria-label="Remote browser">
        <!-- Toolbar -->
        <header class="toolbar">
            <div class="window-controls" aria-hidden="true">
                <span class="dot close"></span>
                <span class="dot minimize"></span>
                <span class="dot maximize"></span>
            </div>
            <div class="address-bar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lock-icon" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="text" id="url-input" placeholder="Enter URL or search..." autocomplete="off" spellcheck="false" />
                <button id="go-btn" aria-label="Navigate">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <div class="status-indicator" id="status-indicator" aria-live="polite">
                <span class="status-dot disconnected" aria-hidden="true"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </header>

        <!-- Tab Bar -->
        <div class="tab-bar" role="tablist" aria-label="Browser tabs">
            <div class="tabs-container" id="tabs-container">
                <!-- Tabs injected dynamically -->
            </div>
            <button id="new-tab-btn" class="new-tab-btn" title="New Tab" aria-label="Open new tab">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Browser Display -->
        <main class="browser-viewport">
            <div class="loading-overlay" id="loading-overlay" role="status">
                <div class="spinner" aria-hidden="true"></div>
                <p id="loading-text">Initializing Stream...</p>
            </div>
            <canvas id="screencast" tabindex="0" aria-label="Remote browser display"></canvas>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
